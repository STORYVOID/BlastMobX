<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlastMobX - Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between select-none">

    <!-- Header Bar -->
    <header class="flex items-center justify-between p-4 bg-gray-800 shadow-md border-b border-gray-700">
        <div class="flex items-center gap-2">
            <div class="bg-yellow-500 text-gray-900 font-bold rounded-full w-10 h-10 flex items-center justify-center text-lg shadow-inner">
                🪙 <span id="coin-count">150</span>
            </div>
        </div>
        <h1 class="text-lg font-bold tracking-wider uppercase text-yellow-400">BlastMobX</h1>
        <div class="bg-gray-700 px-3 py-1 rounded-full text-xs text-yellow-300 border border-yellow-500/30">
            Power: <span id="power-val">0</span>
        </div>
    </header>

    <!-- Main Bag Grid Content -->
    <main class="flex flex-col items-center p-4">
        <h2 class="text-sm font-semibold text-gray-400 mb-3">Tap an item, then tap a bag slot</h2>

        <!-- Bag Grid (7x7) -->
        <div class="bg-gray-800 p-2 rounded-xl border-2 border-yellow-500/50 shadow-2xl inline-block">
            <div id="bag-grid" class="grid grid-cols-7 gap-1 w-[330px] h-[330px]">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Arsenal / Item Pool to Pick From -->
        <div class="mt-6 w-full max-w-[330px]">
            <p class="text-xs text-gray-400 mb-2 font-medium">Available Arsenal (Tap to select):</p>
            <div class="flex gap-3 justify-center">
                <div onclick="selectItem(' pistol', 50, '🔫')" class="item-card bg-gray-800 border-2 border-blue-500 p-2 rounded-lg cursor-pointer flex flex-col items-center hover:bg-gray-700 transition">
                    <span class="text-2xl">🔫</span>
                    <span class="text-[10px] mt-1 text-blue-300">Pistol (50p)</span>
                </div>
                <div onclick="selectItem(' medkit', 30, '💊')" class="item-card bg-gray-800 border-2 border-green-500 p-2 rounded-lg cursor-pointer flex flex-col items-center hover:bg-gray-700 transition">
                    <span class="text-2xl">💊</span>
                    <span class="text-[10px] mt-1 text-green-300">Medkit (30p)</span>
                </div>
                <div onclick="selectItem(' grenade', 80, '💣')" class="item-card bg-gray-800 border-2 border-red-500 p-2 rounded-lg cursor-pointer flex flex-col items-center hover:bg-gray-700 transition">
                    <span class="text-2xl">💣</span>
                    <span class="text-[10px] mt-1 text-red-300">Grenade (80p)</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Navigation Footer -->
    <footer class="p-3 bg-gray-800 shadow-lg flex justify-around border-t border-gray-700 text-sm">
        <button class="text-yellow-400 font-bold">Bag</button>
        <button class="text-gray-400">Arsenal</button>
        <button class="text-gray-400">Upgrades</button>
        <button onclick="alert('Battle mode coming soon!')" class="text-gray-400">Battle ⚔️</button>
    </footer>

    <script>
        let selectedItem = null;
        let totalPower = 0;
        const gridElement = document.getElementById('bag-grid');
        const powerElement = document.getElementById('power-val');

        // Create 49 Slots
        const gridState = Array(49).fill(null);

        function renderGrid() {
            gridElement.innerHTML = '';
            gridState.forEach((item, index) => {
                const cell = document.createElement('div');
                cell.className = "bg-gray-700/60 border border-gray-600 rounded flex items-center justify-center text-xl cursor-pointer hover:bg-gray-600 transition aspect-square";
                cell.innerHTML = item ? item.icon : '';
                cell.onclick = () => placeItem(index);
                gridElement.appendChild(cell);
            });
        }

        function selectItem(name, power, icon) {
            selectedItem = { name, power, icon };
            alert(`Selected: ${name.trim()}. Now tap any slot in the bag!`);
        }

        function placeItem(index) {
            if (!selectedItem) {
                alert('First select an item from the arsenal below!');
                return;
            }
            if (gridState[index] !== null) {
                // Remove power of existing item
                totalPower -= gridState[index].power;
            }
            gridState[index] = selectedItem;
            totalPower += selectedItem.power;
            powerElement.innerText = totalPower;
            selectedItem = null; // Reset selection
            renderGrid();
        }

        renderGrid();
    </script>
</body>
                                                                                 </html>
