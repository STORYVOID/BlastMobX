<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlastMobX - Ultimate Inventory Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-between p-4 select-none">

    <!-- GAME SCREEN: START -->
    <div id="screen-start" class="w-full max-w-sm flex flex-col items-center justify-center my-auto text-center">
        <div class="mb-4 text-6xl">🎒</div>
        <h1 class="text-3xl font-black tracking-wider uppercase text-yellow-400 mb-2">BlastMobX</h1>
        <p class="text-xs text-gray-400 max-w-[250px] mb-8">Pack your inventory, build max power, and crush the enemy boss!</p>
        <button onclick="goToGame()" class="w-full py-4 bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-extrabold text-lg rounded-xl shadow-lg transition transform active:scale-95 uppercase tracking-wide">
            Play Game 🚀
        </button>
    </div>

    <!-- GAME SCREEN: MAIN INVENTORY & BATTLE (Hidden initially) -->
    <div id="screen-game" class="w-full max-w-sm flex flex-col justify-between items-center hidden h-full">
        <!-- Top Status Bar -->
        <div class="w-full flex justify-between items-center bg-gray-900 border border-gray-800 p-3 rounded-xl shadow-lg mb-3">
            <div class="text-xs font-bold text-yellow-400">🪙 <span id="coins">1250</span></div>
            <div class="text-xs font-bold text-yellow-400">⚡ Power: <span id="power">0</span>/500</div>
            <button onclick="resetBag()" class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-lg">Clear</button>
        </div>

        <!-- Main 7x7 Grid Container -->
        <div class="bg-gray-900 p-2.5 rounded-2xl border-2 border-yellow-500/30 shadow-2xl relative">
            <div id="grid" class="grid grid-cols-7 gap-1.5 w-[330px] h-[330px]"></div>
        </div>

        <!-- Bottom Arsenal Selection Bar -->
        <div class="w-full bg-gray-900 border border-gray-800 p-3 rounded-2xl flex justify-around items-center shadow-lg my-3">
            <div onclick="selectItem('Pistol', 50, '🔫')" class="cursor-pointer bg-gray-800 border border-blue-500/50 p-2 rounded-xl text-center w-20 hover:bg-gray-700 transition">
                <div class="text-xl">🔫</div>
                <div class="text-[9px] text-blue-300 mt-0.5">50 Pwr</div>
            </div>
            <div onclick="selectItem('Medkit', 30, '💊')" class="cursor-pointer bg-gray-800 border border-green-500/50 p-2 rounded-xl text-center w-20 hover:bg-gray-700 transition">
                <div class="text-xl">💊</div>
                <div class="text-[9px] text-green-300 mt-0.5">30 Pwr</div>
            </div>
            <div onclick="selectItem('Grenade', 80, '💣')" class="cursor-pointer bg-gray-800 border border-red-500/50 p-2 rounded-xl text-center w-20 hover:bg-gray-700 transition">
                <div class="text-xl">💣</div>
                <div class="text-[9px] text-red-300 mt-0.5">80 Pwr</div>
            </div>
        </div>

        <!-- Battle Trigger Button -->
        <button onclick="triggerBattle()" class="w-full py-3.5 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl shadow-lg uppercase tracking-wider text-sm animate-pulse">
            Battle Boss ⚔️
        </button>
    </div>

    <!-- BATTLE / VICTORY OVERLAY POPUP -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-yellow-500/50 p-6 rounded-2xl text-center max-w-xs w-full shadow-2xl">
            <div id="modal-icon" class="text-4xl mb-2">🏆</div>
            <h2 id="modal-title" class="text-xl font-black text-yellow-400 uppercase mb-2">VICTORY!</h2>
            <p id="modal-desc" class="text-xs text-gray-300 mb-6">You crushed the enemy boss and looted 1500 coins!</p>
            <button onclick="closeModal()" class="w-full py-3 bg-yellow-500 text-gray-950 font-bold rounded-xl uppercase text-xs">Continue</button>
        </div>
    </div>

    <script>
        let selectedItem = null;
        let totalPower = 0;
        let coins = 1250;
        const gridState = Array(49).fill(null);
        const gridEl = document.getElementById('grid');
        const powerEl = document.getElementById('power');
        const coinsEl = document.getElementById('coins');

        function goToGame() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            renderGrid();
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            gridState.forEach((item, index) => {
                const cell = document.createElement('div');
                cell.className = "bg-gray-800/80 border border-gray-700/60 rounded-lg flex items-center justify-center text-xl cursor-pointer active:scale-95 transition aspect-square";
                cell.innerHTML = item ? item.icon : '';
                
                cell.onclick = () => {
                    if (selectedItem) {
                        if (gridState[index]) {
                            totalPower -= gridState[index].power;
                        }
                        gridState[index] = selectedItem;
                        totalPower += selectedItem.power;
                        powerEl.innerText = totalPower;
                        selectedItem = null;
                        renderGrid();
                    } else if (gridState[index]) {
                        totalPower -= gridState[index].power;
                        gridState[index] = null;
                        powerEl.innerText = totalPower;
                        renderGrid();
                    }
                };
                gridEl.appendChild(cell);
            });
        }

        function selectItem(name, power, icon) {
            selectedItem = { name, power, icon };
        }

        function resetBag() {
            gridState.fill(null);
            totalPower = 0;
            powerEl.innerText = 0;
            renderGrid();
        }

        function triggerBattle() {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const icon = document.getElementById('modal-icon');

            modal.classList.remove('hidden');

            if (totalPower >= 100) {
                icon.innerText = '🏆';
                title.innerText = 'VICTORY!';
                coins += 500;
                coinsEl.innerText = coins;
                desc.innerText = `Your Power (${totalPower}) destroyed the Boss! You earned +500 Coins.`;
            } else {
                icon.innerText = '💀';
                title.innerText = 'DEFEAT!';
                desc.innerText = `Your Power (${totalPower}) was too low! You need at least 100 Power to beat the boss. Add more items!`;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
