<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>Mountain Miner — 500m Below</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Inter,system-ui,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#top{position:fixed;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud{background:#101820d9;border:1px solid #ffffff25;border-radius:14px;padding:9px 12px;box-shadow:0 5px 20px #0005;backdrop-filter:blur(8px);font-size:12px;color:#dce6ec}
.hud b{display:block;font-size:17px;color:white;margin-top:2px;font-variant-numeric:tabular-nums}
#progressWrap{position:fixed;top:68px;left:14px;right:14px;height:5px;background:#ffffff30;border-radius:9px;overflow:hidden;pointer-events:none}
#progress{height:100%;width:0;background:linear-gradient(90deg,#f7b84b,#ff7d32);border-radius:9px}
#bottom{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#tip{background:#101820d9;border:1px solid #ffffff25;border-radius:14px;padding:10px 13px;font-size:12px;color:#e5edf1;max-width:72%;line-height:1.35}
#reset{pointer-events:auto;border:1px solid #ffffff40;background:#101820e8;color:white;border-radius:13px;padding:10px 13px;font-weight:700}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#071018a8;padding:20px}
.panel{width:min(390px,100%);border:1px solid #ffffff35;border-radius:24px;background:linear-gradient(150deg,#24323bfa,#101820fa);padding:25px 22px;text-align:center;box-shadow:0 24px 80px #0009}
.logo{font-size:42px}.panel h1{font-size:28px;margin:5px 0 7px;letter-spacing:-1px}.panel p{font-size:14px;color:#c3d0d7;line-height:1.55;margin:8px 0 19px}
.primary{border:0;border-radius:14px;background:linear-gradient(135deg,#ffc45c,#f47b32);color:#26170a;font-weight:900;font-size:15px;padding:14px 22px;width:100%;box-shadow:0 6px 20px #f47b3240}
.small{font-size:11px;color:#91a1aa;margin-top:13px}
#toast{position:fixed;top:104px;left:50%;transform:translateX(-50%);background:#17232beF;border:1px solid #ffffff35;padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="top">
 <div class="hud">⛏️ MINER<b id="depth">0 m</b></div>
 <div class="hud">💰 COINS<b id="coins">0</b></div>
 <div class="hud">💎 FOUND<b id="finds">0</b></div>
</div>
<div id="progressWrap"><div id="progress"></div></div>
<div id="toast"></div>
<div id="bottom"><div id="tip">Touch and drag through the earth to dig.<br>Reach the 500m treasure zone!</div><button id="reset">↻ Restart</button></div>
<div id="overlay"><div class="panel"><div class="logo">🏔️</div><h1>MOUNTAIN MINER</h1><p>Ek purane castle ke neeche chhupe khazane ki talaash karo. Mitti ko ungli se hatao, pathar todte hue 500 metre tak pahucho!</p><button class="primary" id="start">START MINING</button><div class="small">Single-file browser game · No internet required</div></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),c=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,D=1,soil,sc,cam=0,coins=0,dugDepth=0,started=false,drag=false,last=null,found=new Set(),particles=[],toastTimer;
const SURF=430,MAX=5000,PIXELS_PER_METRE=10,PLAYER_X=.5;
const treasures=[
 [0.24,570,8,'GOLD'],[.72,830,12,'CRYSTAL'],[.44,1190,15,'DIAMOND'],
 [.78,1580,10,'GOLD'],[.25,2010,18,'RARE GEM'],[.59,2470,15,'DIAMOND'],
 [.35,3010,12,'GOLD'],[.76,3520,22,'ANCIENT RELIC'],[.48,4140,25,'DEEP CRYSTAL'],
 [.68,4770,40,'500M TREASURE']
];
function resize(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);c.setTransform(D,0,0,D,0,0);
 buildSoil();render();
}
function buildSoil(){
 soil=document.createElement('canvas');soil.width=Math.ceil(W*D);soil.height=Math.ceil(MAX*D);
 sc=soil.getContext('2d');sc.scale(D,D);
 const layers=[
  [0,'#856044'],[.08,'#765139'],[.22,'#654631'],[.42,'#554033'],[.62,'#474039'],[.82,'#39383a'],[1,'#292d34']
 ];
 let gr=sc.createLinearGradient(0,0,0,MAX);layers.forEach(a=>gr.addColorStop(a[0],a[1]));
 sc.fillStyle=gr;sc.fillRect(0,0,W,MAX);
 // natural fine grains and small stones, painted into the earth layer
 for(let i=0;i<Math.floor(W*MAX/260);i++){
  let x=Math.random()*W,y=Math.random()*MAX,r=.5+Math.random()*2.2;
  sc.fillStyle=Math.random()>.48?'#e6c49b18':'#120d0b38';
  sc.beginPath();sc.ellipse(x,y,r*1.8,r,Math.random()*3,0,Math.PI*2);sc.fill();
 }
 for(let i=0;i<1250;i++){
  let y=180+Math.random()*(MAX-180),x=Math.random()*W,r=2+Math.random()*9;
  sc.fillStyle=Math.random()>.5?'#25282a88':'#b18b6440';
  sc.beginPath();sc.ellipse(x,y,r*1.25,r*.7,Math.random()*3,0,Math.PI*2);sc.fill();
 }
 // strata lines
 for(let y=250;y<MAX;y+=230+Math.random()*90){
  sc.strokeStyle='#e0b98a18';sc.lineWidth=2;sc.beginPath();sc.moveTo(0,y);sc.bezierCurveTo(W*.3,y-12,W*.65,y+15,W,y-4);sc.stroke();
 }
}
function rounded(x,y,w,h,r,fill){c.fillStyle=fill;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function castle(x,base,s){
 c.save();c.translate(x,base);c.scale(s,s);
 // rocky hill
 let hill=c.createLinearGradient(0,-300,0,10);hill.addColorStop(0,'#73716d');hill.addColorStop(1,'#343b3d');
 c.fillStyle=hill;c.beginPath();c.moveTo(-210,20);c.lineTo(-170,-65);c.lineTo(-130,-115);c.lineTo(-98,-165);c.lineTo(-50,-220);c.lineTo(5,-250);c.lineTo(73,-220);c.lineTo(130,-160);c.lineTo(185,-85);c.lineTo(215,20);c.closePath();c.fill();
 // abbey
 c.fillStyle='#44494c';c.fillRect(-112,-160,218,115);c.fillRect(-72,-215,150,70);c.fillRect(-23,-275,65,65);
 c.fillStyle='#303a40';c.beginPath();c.moveTo(-27,-275);c.lineTo(8,-342);c.lineTo(43,-275);c.fill();
 c.fillRect(4,-400,8,62);c.beginPath();c.moveTo(4,-400);c.lineTo(8,-426);c.lineTo(12,-400);c.fill();
 for(let i=0;i<8;i++){let x=-104+i*29;c.fillStyle='#3b4246';c.fillRect(x,-192-(i%3)*8,15,42);c.beginPath();c.moveTo(x-4,-192-(i%3)*8);c.lineTo(x+7,-216-(i%3)*8);c.lineTo(x+19,-192-(i%3)*8);c.fill();}
 c.fillStyle='#d5c9ae';for(let i=0;i<8;i++){c.fillRect(-93+i*26,-137,5,14);c.fillRect(-57+i*27,-199,5,13);}
 // clustered village roofs
 for(let i=0;i<9;i++){let x=-175+i*42,y=-42-(i%3)*10;c.fillStyle='#81786d';c.fillRect(x,y,28,35);c.fillStyle='#41484b';c.beginPath();c.moveTo(x-4,y);c.lineTo(x+13,y-18);c.lineTo(x+32,y);c.fill();}
 c.restore();
}
function landscape(){
 let sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#839eae');sky.addColorStop(.57,'#c4c9c4');sky.addColorStop(1,'#d6c8a8');c.fillStyle=sky;c.fillRect(0,0,W,H);
 for(let i=0;i<9;i++){c.fillStyle='#fff2';c.beginPath();c.ellipse((i*137+20)%W,80+(i%4)*45,75,18,0,0,Math.PI*2);c.fill();}
 let base=Math.min(H*.62,Math.max(330,H*.52));
 castle(W*.51,base+40,Math.min(W/410,1.05));
 c.fillStyle='#777d52';c.fillRect(0,base+55,W,H-base-55);
 c.fillStyle='#b0a174';c.fillRect(0,base+55,W,7);
 for(let i=0;i<230;i++){let x=(i*73)%W,y=base+65+(i*47)%(Math.max(30,H-base-65));c.strokeStyle='#34482f88';c.beginPath();c.moveTo(x,y);c.lineTo(x-2,y-5-(i%7));c.stroke();}
 // sheep in foreground
 for(let i=0;i<Math.ceil(W/82);i++){let x=(i*91+26)%W,y=H-53-(i%3)*7;c.fillStyle='#e2dfd1';c.beginPath();c.ellipse(x,y,17,10,0,0,Math.PI*2);c.fill();c.fillStyle='#34383a';c.beginPath();c.arc(x+14,y-2,5.5,0,Math.PI*2);c.fill();c.strokeStyle='#303438';c.lineWidth=2;c.beginPath();c.moveTo(x-7,y+7);c.lineTo(x-8,y+14);c.moveTo(x+7,y+7);c.lineTo(x+8,y+14);c.stroke();}
 return base+55;
}
let surfaceY=SURF;
function drawPlayer(x,y){
 // small miner with helmet, body and pickaxe
 c.save();c.translate(x,y);
 c.fillStyle='#171d22';c.beginPath();c.arc(0,-13,9,Math.PI,0);c.fill();
 c.fillStyle='#e7a56c';c.beginPath();c.arc(0,-11,6,0,Math.PI*2);c.fill();
 rounded(-7,-5,14,19,4,'#d87935');
 c.strokeStyle='#20252a';c.lineWidth=4;c.beginPath();c.moveTo(-4,12);c.lineTo(-7,22);c.moveTo(4,12);c.lineTo(7,22);c.stroke();
 c.strokeStyle='#8a633d';c.lineWidth=3;c.beginPath();c.moveTo(7,-1);c.lineTo(19,-17);c.stroke();
 c.strokeStyle='#cbd3d5';c.lineWidth=4;c.beginPath();c.moveTo(12,-12);c.lineTo(23,-19);c.stroke();
 c.restore();
}
function drawUnderground(){
 let bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#252a2d');bg.addColorStop(1,'#11171d');c.fillStyle=bg;c.fillRect(0,0,W,H);
 c.save();c.translate(0,-cam);c.drawImage(soil,0,0,W,MAX);
 // exposed gems glow from within soil; vanish when collected
 treasures.forEach((t,i)=>{if(found.has(i))return;let x=t[0]*W,y=t[1],r=t[2];c.save();c.shadowColor=t[3]==='GOLD'?'#ffc64b':'#72dfff';c.shadowBlur=15;c.fillStyle=t[3]==='GOLD'?'#f4bd45':t[3]==='DIAMOND'?'#c8f5ff':t[3]==='RARE GEM'?'#c58aff':'#6de2ee';c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*.72,y);c.lineTo(x,y+r);c.lineTo(x-r*.72,y);c.closePath();c.fill();c.restore();});
 c.restore();
 // faint headlamp cone
 let py=H*.46;c.save();let beam=c.createRadialGradient(W/2,py,3,W/2,py,155);beam.addColorStop(0,'#ffe4a51f');beam.addColorStop(1,'#ffe4a500');c.fillStyle=beam;c.fillRect(W/2-160,py-160,320,320);c.restore();
 drawPlayer(W/2,py);
}
function render(){
 if(!W||!H)return;c.clearRect(0,0,W,H);
 if(cam<surfaceY*.45){
  let sy=landscape();surfaceY=sy;
  // soil beneath the meadow
  c.drawImage(soil,0,surfaceY,W,H-surfaceY,0,surfaceY,W,H-surfaceY);
  drawPlayer(W/2,surfaceY+30-cam);
 }else drawUnderground();
 $('depth').textContent=Math.floor(Math.max(0,dugDepth)/PIXELS_PER_METRE)+' m';
 $('coins').textContent=coins;$('finds').textContent=found.size;
 $('progress').style.width=Math.min(100,dugDepth/(500*PIXELS_PER_METRE)*100)+'%';
 if(dugDepth>=500*PIXELS_PER_METRE){$('tip').innerHTML='🏆 500 METRES! You found the deep zone.<br>Keep exploring or restart for another run.';}
}
function showToast(msg){let el=$('toast');el.textContent=msg;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1500);}
function digAt(sx,sy){
 if(!started)return;
 let wy=sy+cam;
 if(wy<surfaceY-10)return;
 // erase soft earth in overlapping strokes, creating a smooth hand-dug tunnel
 sc.save();sc.globalCompositeOperation='destination-out';sc.beginPath();sc.arc(sx,wy,24,0,Math.PI*2);sc.fill();sc.restore();
 dugDepth=Math.max(dugDepth,wy-surfaceY);
 treasures.forEach((t,i)=>{if(found.has(i))return;let dx=sx-t[0]*W,dy=wy-t[1];if(Math.hypot(dx,dy)<t[2]+26){found.add(i);let reward=t[3]==='500M TREASURE'?250:t[3]==='ANCIENT RELIC'?100:t[3]==='DIAMOND'?35:t[3]==='RARE GEM'?60:t[3]==='GOLD'?15:25;coins+=reward;showToast('✨ '+t[3]+'  +'+reward+' coins');}});
 // camera tracks the dig point so the miner stays around the centre
 if(wy>surfaceY+H*.25)cam=Math.min(MAX-H,Math.max(0,wy-H*.48));
 if(dugDepth>=500*PIXELS_PER_METRE&&!found.has(9))showToast('🏆 500m reached! The deepest treasure is nearby!');
 render();
}
function pointerDown(e){if(!started)return;drag=true;last={x:e.clientX,y:e.clientY};canvas.setPointerCapture?.(e.pointerId);digAt(last.x,last.y);}
function pointerMove(e){if(!drag)return;let p={x:e.clientX,y:e.clientY};let dx=p.x-last.x,dy=p.y-last.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/9));for(let i=1;i<=n;i++)digAt(last.x+dx*i/n,last.y+dy*i/n);last=p;}
function pointerUp(){drag=false;last=null;}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
$('start').onclick=()=>{$('overlay').style.display='none';started=true;$('tip').innerHTML='Drag your finger through the soil to dig.<br>Follow the glowing gems!';};
function reset(){cam=0;coins=0;dugDepth=0;found.clear();started=false;drag=false;buildSoil();$('overlay').style.display='grid';$('tip').innerHTML='Touch and drag through the earth to dig.<br>Reach the 500m treasure zone!';render();}
$('reset').onclick=reset;addEventListener('resize',resize);resize();
})();
</script>
</body>
</html>
