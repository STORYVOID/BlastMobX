<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlastMobX - Start</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between items-center p-6 select-none">

    <!-- Top Space -->
    <div class="w-full flex justify-end">
        <button onclick="alert('Settings coming soon!')" class="bg-gray-800 p-2 rounded-full text-gray-400 hover:text-white">
            ⚙️
        </button>
    </div>

    <!-- Center Logo / Title -->
    <div class="flex flex-col items-center text-center">
        <div class="mb-4 text-6xl">🎒</div>
        <h1 class="text-3xl font-black tracking-wider uppercase text-yellow-400 mb-2">BlastMobX</h1>
        <p class="text-xs text-gray-400 max-w-[250px]">Turn your backpack into a war machine and crush waves of enemies!</p>
    </div>

    <!-- Start Button -->
    <div class="w-full max-w-xs mb-10">
        <button onclick="startGame()" class="w-full py-4 bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-extrabold text-lg rounded-xl shadow-lg transition transform active:scale-95 uppercase tracking-wide">
            Play Game 🚀
        </button>
    </div>

    <script>
        function startGame() {
            // Agle step mein hum yahan se Bag Inventory screen par jayenge
            alert('Starting BlastMobX! Next step: Bag Inventory screen.');
        }
    </script>
</body>
</html>
