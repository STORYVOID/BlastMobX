<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marking Game</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header Bar -->
    <header class="flex items-center justify-between p-4 bg-white shadow-md">
        <div class="flex items-center gap-2">
            <div class="bg-yellow-400 text-yellow-900 font-bold rounded-full w-10 h-10 flex items-center justify-center text-xl shadow-inner">
                36
            </div>
            <span class="text-gray-600 text-sm">Coins</span>
        </div>
        <h1 class="text-xl font-bold text-gray-800 uppercase tracking-wider">Marking Game</h1>
        <div class="w-10 h-10 bg-gray-200 rounded-full"></div>
    </header>

    <!-- Main Bag Grid Content -->
    <main class="flex flex-col items-center p-4">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Prepare Your Bag</h2>

        <div class="bg-gray-200 p-2 rounded-lg border-4 border-gray-400 shadow-xl inline-block">
            <div class="grid grid-cols-7 gap-1 w-[350px] h-[350px]">
                <!-- Grid Cells -->
                <script>
                    for (let i = 0; i < 49; i++) {
                        document.write('<div class="bg-gray-300 border border-gray-400 rounded aspect-square flex items-center justify-center text-[10px] text-gray-500 hover:bg-gray-400 cursor-pointer">Slot</div>');
                    }
                </script>
            </div>
        </div>
        <p class="text-xs text-gray-500 mt-4">Tap slots to arrange your gear!</p>
    </main>

    <!-- Navigation Footer -->
    <footer class="p-4 bg-white shadow-lg flex justify-around border-t border-gray-200">
        <button class="text-blue-600 font-medium">Bag</button>
        <button class="text-gray-500">Arsenal</button>
        <button class="text-gray-500">Upgrades</button>
        <button class="text-gray-500">Battle</button>
    </footer>

</body>
</html>
