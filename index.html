<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlastMobX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-between p-4 select-none">

    <!-- Top Status Bar -->
    <div class="w-full max-w-sm flex justify-between items-center bg-gray-900 border border-gray-800 p-3 rounded-xl shadow-lg">
        <div class="text-sm font-bold text-yellow-400">⚡ Power: <span id="power">0</span></div>
        <button onclick="resetBag()" class="text-xs bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-lg">Clear</button>
    </div>

    <!-- Main 7x7 Grid -->
    <div class="my-auto">
        <div class="bg-gray-900 p-2.5 rounded-2xl border-2 border-yellow-500/30 shadow-2xl">
            <div id="grid" class="grid grid-cols-7 gap-1.5 w-[330px] h-[330px]"></div>
        </div>
    </div>

    <!-- Bottom Item Selection Bar -->
    <div class="w-full max-w-sm bg-gray-900 border border-gray-800 p-3 rounded-2xl flex justify-around items-center shadow-lg">
        <div onclick="selectItem('Pistol', 50, '🔫')" class="cursor-pointer bg-gray-800 border border-blue-500/50 p-2 rounded-xl text-center w-20 hover:bg-gray-700 transition">
            <div class="text-2xl">🔫</div>
            <div class="text-[10px] text-blue-300 mt-0.5">50 Pwr</div>
        </div>
        <div onclick="selectItem('Medkit', 30, '💊')" class="cursor-pointer bg-gray-800 border border-green-500/50 p-2 rounded-xl text-center w-20 hover:bg-gray-700 transition">
            <div class="text-2xl">💊</div>
            <div class="text-[10px] text-green-300 mt-0.5">30 Pwr</div>
        </div>
        <div onclick="selectItem('Grenade', 80, '💣')" class="cursor-pointer bg-gray-800 border border-red-500/50 p-2 rounded-xl text-center w-20 hover:bg-gray-700 transition">
            <div class="text-2xl">💣</div>
            <div class="text-[10px] text-red-300 mt-0.5">80 Pwr</div>
        </div>
    </div>

    <script>
        let selectedItem = null;
        let totalPower = 0;
        const gridState = Array(49).fill(null);
        const gridEl = document.getElementById('grid');
        const powerEl = document.getElementById('power');

        function renderGrid() {
            gridEl.innerHTML = '';
            gridState.forEach((item, index) => {
                const cell = document.createElement('div');
                cell.className = "bg-gray-800/80 border border-gray-700/60 rounded-lg flex items-center justify-center text-2xl cursor-pointer active:scale-95 transition aspect-square";
                cell.innerHTML = item ? item.icon : '';
                
                cell.onclick = () => {
                    if (selectedItem) {
                        if (gridState[index]) {
                            totalPower -= gridState[index].power;
                        }
                        gridState[index] = selectedItem;
                        totalPower += selectedItem.power;
                        powerEl.innerText = totalPower;
                        selectedItem = null;
                        renderGrid();
                    } else if (gridState[index]) {
                        totalPower -= gridState[index].power;
                        gridState[index] = null;
                        powerEl.innerText = totalPower;
                        renderGrid();
                    }
                };
                gridEl.appendChild(cell);
            });
        }

        function selectItem(name, power, icon) {
            selectedItem = { name, power, icon };
        }

        function resetBag() {
            gridState.fill(null);
            totalPower = 0;
            powerEl.innerText = 0;
            renderGrid();
        }

        renderGrid();
    </script>
</body>
</html>
